<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My ATM Machine</title>
  <link rel="stylesheet" href="Assets/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="atm-box">
  <h1>ATM</h1>
  <div class="display" id="display">0</div>

  <div class="mb-3">
    <input type="number" id="amount" class="form-control form-control-lg text-end" placeholder="Enter amount" min="500">
  </div>

  <div class="d-grid gap-2">
    <button class="btn btn-primary btn-lg" onclick="withdraw()">Withdraw</button>
    <button class="btn btn-danger btn-lg" onclick="clr()">Clear</button>
  </div>

  <div id="result" class="mt-3"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="Assets/script.js"></script>
</body>
</html>
